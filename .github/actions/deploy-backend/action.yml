name: Deploy backend via SSM
description: >
  Rolling-restarts a CTech backend service's ASG instances over SSM
  RunCommand, running /opt/app/deploy.sh (written by ctech-cdk's
  setup-deploy.sh) with the given artifact key. Requires AWS credentials
  already configured in the job and the artifact already uploaded to
  s3://<deployments-bucket>/<artifact-key>.

inputs:
  asg-name:
    description: Auto Scaling Group name, e.g. prod-ctech-wallet.
    required: true
  artifact-key:
    description: S3 key deploy.sh should fetch, e.g. ctech-wallet/api/current.zip.
    required: true
  timeout-seconds:
    description: >
      Max seconds deploy.sh may run per instance (SSM executionTimeout); the
      action waits this long plus a delivery margin before giving up.
    required: false
    default: "300"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ASG_NAME: ${{ inputs.asg-name }}
        ARTIFACT_KEY: ${{ inputs.artifact-key }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail

        # ARTIFACT_KEY is interpolated into a shell command string that SSM
        # runs on the instance (commands=[...] below) — reject anything that
        # could break out of the single quotes before it ever gets there.
        if [[ ! "$ARTIFACT_KEY" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "::error::artifact-key contains characters outside [A-Za-z0-9._/-]: $ARTIFACT_KEY"
          exit 1
        fi
        # Also interpolated into the SSM parameters string below.
        if [[ ! "$TIMEOUT_SECONDS" =~ ^[0-9]+$ ]]; then
          echo "::error::timeout-seconds must be a positive integer: $TIMEOUT_SECONDS"
          exit 1
        fi

        INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
          --auto-scaling-group-names "$ASG_NAME" \
          --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
          --output text | tr '\t' ',')

        if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
          echo "No in-service instances in $ASG_NAME — new instances will bootstrap from $ARTIFACT_KEY"
          exit 0
        fi

        # deploy.sh (setup-deploy.sh, ctech-cdk) auto-detects a rolling
        # (app + app2) vs. traditional (app only) restart from files written
        # by that instance's own userdata — this action does not need to know
        # which.
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=instanceids,Values=$INSTANCE_IDS" \
          --parameters "commands=['/opt/app/deploy.sh $ARTIFACT_KEY'],executionTimeout=['$TIMEOUT_SECONDS']" \
          --timeout-seconds "$TIMEOUT_SECONDS" \
          --query "Command.CommandId" --output text)

        # Not `aws ssm wait command-executed`: that waiter gives up after
        # ~100s regardless of the command's own timeout, reporting a still
        # running deploy as failed. Poll until a terminal status or deadline.
        # One shared deadline: SSM runs every instance in parallel.
        DEADLINE=$((SECONDS + TIMEOUT_SECONDS + 60))
        FAILED=0
        for INSTANCE_ID in $(echo "$INSTANCE_IDS" | tr ',' ' '); do
          while :; do
            # InvocationDoesNotExist right after send-command: treat as Pending.
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed|Cancelling) ;;
              *) break ;;
            esac
            [ "$SECONDS" -ge "$DEADLINE" ] && break
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed on $INSTANCE_ID ($STATUS)"
            # deploy.sh reports health-check failures on stdout.
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "[StandardOutputContent,StandardErrorContent]" --output text
            FAILED=1
          else
            echo "✓ $INSTANCE_ID"
          fi
        done
        exit $FAILED
