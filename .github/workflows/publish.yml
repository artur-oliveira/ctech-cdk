name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; pin explicitly rather than
      # trusting whatever setup-node's Node 24 bundles today.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npx tsc -p tsconfig.build.json

      # No NPM_TOKEN: npm's OIDC trusted publisher (configured on npmjs.com for
      # this repo + this workflow file) exchanges the job's id-token for a
      # short-lived publish credential. --provenance attaches the signed
      # build-provenance attestation.
      - run: npm publish --provenance
