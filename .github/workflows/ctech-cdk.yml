name: CTech Infrastructure

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff:
    name: CDK Diff
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.base_ref }}" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ctech-ec2-agent
        working-directory: assets/ctech-ec2-agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/ctech-ec2-agent .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-gha-infra
          aws-region: us-east-1

      - name: CDK Diff
        id: diff
        run: npx cdk diff --all 2>&1 | tee diff.txt
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}

      - name: Comment diff on PR
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('diff.txt', 'utf8');
            const body = `## CTech CDK Diff (\`${{ steps.env.outputs.name }}\`)\n\`\`\`\n${diff.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  deploy:
    name: CDK Deploy
    runs-on: ubuntu-slim
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ctech-ec2-agent
        working-directory: assets/ctech-ec2-agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/ctech-ec2-agent .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-gha-infra
          aws-region: us-east-1

      # Deploy global stack once (idempotent - only creates/updates if changed).
      # Per-env stacks are scoped by the ENVIRONMENT prefix.
      - name: CDK Deploy - Global
        run: npx cdk deploy Ctech-Global --require-approval never
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}

      - name: CDK Deploy - Per-environment
        run: |
          ENV="${{ steps.env.outputs.name }}"
          npx cdk deploy "Ctech-${ENV^}-*" --require-approval never
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
