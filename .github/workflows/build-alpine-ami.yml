name: Build Alpine AMI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment whose ctech-ec2-agent build to bake in (dev, stage, prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Packer build
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-gha-packer
          aws-region: us-east-1

      - name: Resolve ctech-ec2-agent location
        id: agent
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          BUCKET=$(aws ssm get-parameter --name "/ctech/${TARGET_ENV}/ctech-ec2-agent/bucket" --query Parameter.Value --output text)
          VERSION=$(aws ssm get-parameter --name "/ctech/${TARGET_ENV}/ctech-ec2-agent/version" --query Parameter.Value --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download ctech-ec2-agent
        run: |
          aws s3 cp "s3://${{ steps.agent.outputs.bucket }}/${{ steps.agent.outputs.version }}/ctech-ec2-agent" ./packer/ctech-ec2-agent
          chmod +x ./packer/ctech-ec2-agent

      - name: Resolve previous AMI (for cleanup, if any)
        id: previous
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          PREV_AMI=$(aws ssm get-parameter --name "/ctech/${TARGET_ENV}/ami/alpine/arm64" --query Parameter.Value --output text 2>/dev/null || echo "")
          echo "ami_id=$PREV_AMI" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Packer init
        working-directory: packer
        run: packer init alpine-arm64.pkr.hcl

      - name: Packer build
        id: build
        working-directory: packer
        run: |
          packer build -machine-readable alpine-arm64.pkr.hcl | tee build.log
          AMI_ID=$(grep 'artifact,0,id' build.log | tail -1 | cut -d, -f6 | cut -d: -f2)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      - name: Publish AMI id to SSM
        env:
          TARGET_ENV: ${{ inputs.environment }}
          AMI_ID: ${{ steps.build.outputs.ami_id }}
        run: |
          aws ssm put-parameter \
            --name "/ctech/${TARGET_ENV}/ami/alpine/arm64" \
            --value "$AMI_ID" \
            --type String --overwrite

      # Only runs after the new AMI is confirmed live in SSM, and only against
      # the AMI it just replaced — never the one just published. Without this,
      # every re-run leaves its old AMI's EBS snapshot billing forever.
      - name: Deregister the previous AMI and delete its snapshot
        if: steps.previous.outputs.ami_id != '' && steps.previous.outputs.ami_id != steps.build.outputs.ami_id
        env:
          PREV_AMI: ${{ steps.previous.outputs.ami_id }}
        run: |
          SNAPSHOT_IDS=$(aws ec2 describe-images --image-ids "$PREV_AMI" \
            --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' --output text 2>/dev/null || echo "")
          aws ec2 deregister-image --image-id "$PREV_AMI" \
            || echo "Could not deregister $PREV_AMI (already gone?) — continuing" >&2
          for SNAP in $SNAPSHOT_IDS; do
            if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then
              aws ec2 delete-snapshot --snapshot-id "$SNAP" \
                || echo "Could not delete snapshot $SNAP — continuing" >&2
            fi
          done
